<style>
:root{--bg:#F0F2F5;--card:#fff;--ink:#222;--muted:#7A808A;--line:#E3E6EB;--accent:#F97316;--ok:#1E9E5A;--warn:#D9822B;--no:#C9CDD3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
input,button{font:inherit;color:inherit}
input{font-size:16px!important}
.wrap{max-width:680px;margin:0 auto;padding:10px 12px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 10px}
header h1{font-size:20px;margin:0;font-weight:700}
header small{display:block;color:var(--muted);font-size:13px}
.stat{font-size:13px;color:var(--muted);text-align:right}
.stat b{display:block;font-size:17px;color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;height:42px;padding:0 12px}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:var(--card);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.fast{background:#FFE9D6;border-radius:14px;padding:12px;margin:10px 0}
.fast b{font-size:15px}
.fast p{margin:4px 0 8px;font-size:13px;color:#5b5b5b}
.fast .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pct{border:1.5px solid #E2D58A;background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.pct[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.go{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;margin-left:auto}
.go:disabled{opacity:.4}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid #EEF0F3}
.item:last-child{border-bottom:0}
.item.off .nm{color:var(--muted)}
.nm{font-weight:600;font-size:14.5px;line-height:1.25;min-width:0}
.nm small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.price{display:flex;align-items:center;gap:5px}
.price input{width:104px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 9px;text-align:right;background:#FAFBFC;outline:0}
.price input:focus{border-color:var(--ink);background:#fff}
.price input.set{border-color:#BFE3CC;background:#F2FBF5}
.price span{color:var(--muted);font-size:12px;white-space:nowrap;min-width:38px}
.row2{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.hint{color:var(--muted)} .hint.ok{color:var(--ok)} .hint.warn{color:var(--warn)}
.sug{border:1px dashed #C9CDD3;background:#fff;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.sw{display:flex;border-radius:999px;background:#EEF0F3;padding:2px;margin-left:auto}
.sw button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sw button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.sw button[aria-pressed="true"].n{background:var(--no);color:var(--ink)}
.more{display:block;width:100%;border:0;background:var(--card);border-radius:12px;padding:12px;margin-top:8px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar button{display:block;width:100%;max-width:680px;margin:0 auto;height:52px;border:0;border-radius:14px;background:var(--accent);font-weight:700;font-size:16px}
.bar button:disabled{background:#E2E5EA;color:var(--muted)}
.msg{background:var(--card);border-radius:14px;padding:20px;text-align:center;color:var(--muted);margin-top:24px}
.imp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.imp>div{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.imp h2{margin:0 0 4px;font-size:18px}
.imp textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:#fff;font-size:14px}
.imp .acts{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.imp .acts button,.imp .filebtn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--card)}
.imp .acts .main{background:var(--accent)}
.imp .acts button:disabled{opacity:.4}
.imp .field{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
.imp .field input,.imp .field select{display:block;width:100%;height:42px;margin-top:3px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink)}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid #EEF0F3;font-size:13.5px}
.irow small{display:block;color:var(--muted);font-size:12px}
.irow.no{opacity:.55}
.irow b.ok{color:var(--ok)} .irow b.warn{color:var(--warn)} .irow b.no{color:var(--muted)}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1;border:0;border-radius:12px;background:var(--card);padding:10px 6px;font-weight:600;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.oacts{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--card)}
.oacts button{flex:1 1 auto;min-height:46px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#EEF0F3}
.oacts button.main{background:var(--accent);color:#fff}
.oacts button:disabled{opacity:.45}
.tg{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #EEF0F3;background:var(--card);padding:10px;font-size:13.5px}
.tg small{display:block;color:var(--muted);font-size:12px}
.tg .yn{border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:#E3F5EA;color:var(--ok)}
.tg.no{opacity:.6} .tg.no .yn{background:#EEF0F3;color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.kpi div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:22px;color:var(--ink)}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.kpi2 div{background:var(--card);border-radius:12px;padding:12px 10px;font-size:12.5px;color:var(--muted)}
.kpi2 b{display:block;font-size:20px;color:var(--ink)}
.kpi2 small{display:block;font-size:11.5px;margin-top:2px}
.sec{font-size:15px;margin:14px 2px 6px}
#today .acts{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
#today .acts button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--card)}
#today .acts .main{background:var(--accent)}
#today .list .acts{padding:8px 10px;margin:0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.lgn{text-align:center;padding:40px 12px}.lgn h1{font-size:22px;margin:0 0 8px}.lgn .muted{color:var(--muted)}
.lgn .btn{border:0;border-radius:14px;height:52px;line-height:52px;color:var(--ink);background:var(--accent);font-weight:700;font-size:16px}.lgn .btn[disabled]{opacity:.5}
.tabs .out{flex:0 0 auto;padding:10px 12px;color:var(--muted)}
</style>
<link rel="stylesheet" href="xtheme.css">
<style>
/* Ҳайдовчи иловаси дизайни (xtheme.css) дўкон кабинетига: шиша панел, тагчизиқли бўлимлар, оқ карталар, тўқ сариқ градиент тугмалар.
   Фақат кўриниш: мантиқ ва маълумот ўзгармайди. */
:root{--bg:#F6F3EE;--card:#FFFFFF;--ink:#1F2430;--muted:rgba(31,36,48,.67);--line:rgba(31,36,48,.12);--ok:#10B981;--warn:#D97706;--gl:rgba(31,36,48,.11)}
html,body{font:400 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:visible!important} /* html'даги hidden viewportга ўтади — ёпишқоқ панел ишлаши учун */
.wrap{padding-top:0}
/* юқори панел: ҳайдовчидаги каби бутун эн бўйлаб, ёпишқоқ, бўлимлар ичида */
header{display:block;position:sticky;top:0;z-index:5;margin:0 -12px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 0}
header .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 10px}
header .hl{min-width:0}
header h1.qx{font-size:18px;font-weight:800}
header small{font-size:13.5px;margin-top:2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;color:rgba(31,36,48,.67)}.stat b{color:#1F2430;font-size:18px;font-weight:800}
header .tabs{display:flex;gap:0;margin:0;background:transparent!important;border-top:1px solid rgba(31,36,48,.10);border-bottom:0!important;position:static}
header .tabs button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;border:0!important;border-radius:0;background:none!important;padding:13px 2px;font-size:14px;font-weight:600;border-bottom:3px solid transparent!important}
header .tabs button[aria-pressed="true"]{color:#1F2430!important;border-bottom-color:var(--accent)!important;background:none!important}
header .tabs .out{flex:0 0 48px;padding:13px 0}
/* карталар ва рўйхатлар */
.list,.msg,.kpi div,.kpi2 div,.search,.more{background:#FFFFFF;border:1px solid var(--gl);border-radius:14px}
.item,.irow,.tg{border-bottom-color:var(--gl)!important}
.irow,.tg,.oacts{background:#FFFFFF}
.kpi b,.kpi2 b{font-weight:800}
.sec{font-size:16px;font-weight:700;color:#1F2430;margin:16px 2px 8px}
.nm{font-weight:600}
.irow b.warn,.hint.warn{color:var(--warn)}
/* чиплар: ҳайдовчи панелидаги фаол тугма каби */
.chip{background:#FFFFFF;border:1px solid var(--gl);color:#1F2430;padding:7px 12px}
.chip[aria-pressed="true"]{background:rgba(249,115,22,.14)!important;color:#1F2430!important;border-color:rgba(249,115,22,.45)}
.chip[data-imp]{background:var(--grad)!important;color:#fff!important;border:0;box-shadow:0 6px 20px rgba(249,115,22,.22)}
/* тез тўлдириш ва ҳисоб блоклари */
.fast{background:#FFFFFF;border:1px solid rgba(249,115,22,.30);border-radius:14px}
.fast p{color:rgba(31,36,48,.72)}
.fast .irow{background:transparent;padding-left:0;padding-right:0}
.list+.fast{margin-top:10px!important}
.pct{border:1px solid rgba(31,36,48,.14);background:#FFFFFF}
.pct[aria-pressed="true"]{background:rgba(249,115,22,.14);border-color:rgba(249,115,22,.45);color:#1F2430}
/* тугмалар: асосийси — градиент, қолгани — оқ рамкали (ҳайдовчидаги .btn / .btn.alt) */
.go,.oacts button.main,.imp .acts .main,#today .acts .main,.bar button{background:var(--grad)!important;color:#fff!important;border:0;box-shadow:0 6px 20px rgba(249,115,22,.22)}
.oacts button.main:disabled,.bar button:disabled,.go:disabled{background:#E9E4DC!important;color:rgba(31,36,48,.5)!important;box-shadow:none;opacity:1!important}
.oacts button:not(.main),#today .acts button:not(.main),.imp .acts button:not(.main),.imp .filebtn{background:#FFFFFF;border:1px solid rgba(31,36,48,.13);color:#1F2430}
.oacts button,.bar button{border-radius:12px}
.bar{background:linear-gradient(transparent,#F6F3EE 35%)!important}
.price input{border-width:1px;background:#FFFFFF}.price input:focus{border-color:var(--accent)}
.sw{background:#F1EDE6!important}
.sw button[aria-pressed="true"].y{background:linear-gradient(135deg,#10B981,#059669)}
.tg .yn{background:rgba(16,185,129,.14);color:#047857}.tg.no .yn{background:#F1EDE6;color:rgba(31,36,48,.67)}
.sug{border-color:rgba(249,115,22,.45);color:#C2410C}
.imp>div{background:#F6F3EE}.imp h2{color:#1F2430}
.toast{box-shadow:0 8px 24px rgba(31,36,48,.12)}
.lgn .btn{color:#fff}
a{color:#C2410C}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Юкланмоқда…</div></div>
<div class="bar" id="bar" hidden><button id="save" disabled>Сақлаш</button></div>
<div class="toast" id="toast"></div>
<script src="page-seller.js"></script>
</body>
