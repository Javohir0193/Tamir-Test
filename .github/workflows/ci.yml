# Ҳар бир push ва PR'да оддий текширувлар. Натижа: GitHub → Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JS файллар синтаксиси
        run: for f in *.js scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: HTML ичидаги скриптлар синтаксиси
        run: node scripts/check-inline.mjs

      - name: Уланган файллар мавжудлиги
        run: node scripts/check-refs.mjs

      - name: CSP мета-тег _headers билан бир хил (GitHub Pages учун)
        run: node scripts/sync-csp-meta.mjs --check

      - name: Махфий калитлар (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact -v

  db:
    # Миграциялар бўш базага қўлланади, орқага қайтарилади ва яна қўлланади, кейин pgTAP тестлари (scripts/db-test.sh).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: pgTAP (базага кенгайтма, runner'га pg_prove)
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap > /dev/null"
          sudo apt-get update -qq && sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl > /dev/null
      - name: Миграциялар (олдинга, орқага, яна олдинга) ва pgTAP
        run: scripts/db-test.sh

  e2e:
    # Харидор сайти браузерда (Playwright): бозор → сават → буюртма → «Тестовая оплата».
    # База — шу ердаги бўш Postgres (e2e/setup-db.sh); test ва prod Supabase'га сўров кетмайди (e2e/gateway.mjs).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Кутубхоналар
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: База (миграциялар + синов маълумоти)
        run: bash e2e/setup-db.sh
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Ҳисобот (хато бўлса)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
