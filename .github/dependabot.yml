# Dependabot: ҳафтада бир марта эскирган версияларни топиб PR очади. Ҳар PR CI'дан ўтади (e2e ҳам), кейин қўлда merge.
# Сайтдаги CDN кутубхоналар (supabase-js@2.45.4, leaflet) HTML'да қаттиқ ёзилган — уларни Dependabot кўрмайди, қўлда янгиланади.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    groups:
      e2e:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # сайт CDN'дан худди шу версияни юклайди (index.html); e2e уни алмаштиради — версиялар бир хил қолсин
      - dependency-name: "@supabase/supabase-js"
    commit-message:
      prefix: "e2e"
