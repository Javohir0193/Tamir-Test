<style>
.pick{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
.pick-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-size:17px}
.pick-top .x{border:0;background:#F0F2F5;border-radius:10px;width:40px;height:40px;font-size:18px}
.pick-mw{flex:1;position:relative}.pick-map{position:absolute;inset:0}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:40px;pointer-events:none;z-index:500;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.pick-bot{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pick-bot small{color:#6b7280;text-align:center}

:root{--bg:#F0F2F5;--card:#fff;--ink:#222;--muted:#7A808A;--line:#E3E6EB;--accent:#F97316;--ok:#1E9E5A;--warn:#D9822B;--bad:#C8463D}
*{box-sizing:border-box}
html{overflow-x:hidden}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:visible}
input,button,select{font:inherit;color:inherit}
input,select{font-size:16px!important}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:7;background:#F97316;color:#1B1F24;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-radius:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
header{padding-right:66px}header b{flex:1;font-size:17px}header span{font-size:13px;color:rgba(27,31,36,.78)}
header button{border:0;border-radius:10px;background:rgba(255,255,255,.92);color:#1B1F24;font:inherit;font-weight:600;font-size:13px;padding:7px 11px}
.lg{max-width:360px;margin:12vh auto 0;text-align:center;padding:0 16px}.lg h1{font-size:24px}
.wrap{max-width:680px;margin:0 auto;padding:10px 12px 150px}
h1{font-size:20px;margin:4px 0 10px}
h2{font-size:15px;margin:16px 2px 8px;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;background:var(--accent);font-weight:600;padding:11px 14px}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#EEF0F3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.bar{height:6px;border-radius:99px;background:#E2E5EA;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:#EEF0F3}
.pill.y{background:var(--accent)} .pill.g{background:#DDF3E6;color:#13693B} .pill.r{background:#FBE1DF;color:var(--bad)}
.field{display:block;margin:0 0 10px;font-size:13px;color:var(--muted)}
.field input,.field select{display:block;width:100%;margin-top:4px;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;outline:0}
.field input:focus,.field select:focus{border-color:var(--ink)}
.ln{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;padding:10px 0;border-bottom:1px solid #EEF0F3;align-items:start}
.ln:last-child{border-bottom:0}
.ln input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.ln .nm{font-weight:600;font-size:14.5px}
.ln .in{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln .in input{width:84px;height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 8px;text-align:right;background:#FAFBFC}
.ln .in input.pr{width:110px}
.done-ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #EEF0F3}
.done-ln:last-child{border-bottom:0}
.sticky{position:fixed;left:0;right:0;bottom:62px;padding:8px 12px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.sticky .btn{display:block;width:100%;max-width:680px;margin:0 auto;height:52px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;height:42px;padding:0 12px;margin-bottom:8px}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid #EEF0F3}
.pitem:last-child{border-bottom:0}
.pitem input{width:104px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 9px;text-align:right;background:#FAFBFC}
.pitem input.set{border-color:#BFE3CC;background:#F2FBF5}
.sw{display:flex;border-radius:999px;background:#EEF0F3;padding:2px}
.sw button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sw button[aria-pressed="true"].y{background:var(--ok);color:#fff}
.sw button[aria-pressed="true"].n{background:#C9CDD3;color:var(--ink)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.msg{background:var(--card);border-radius:14px;padding:20px;text-align:center;color:var(--muted);margin-top:24px}
a{color:inherit}

header nav{position:static;display:flex;flex:none;gap:2px;padding:0;border:0;background:transparent;grid-template-columns:none}
header nav[hidden]{display:none}
header nav button{flex-direction:row;padding:7px 9px;border-radius:12px;font-size:0;line-height:0;color:rgba(27,31,36,.72);gap:0}
header nav button b{font-size:22px;line-height:1;display:inline-flex}
header nav button .sk{width:24px!important;height:24px!important;margin:0!important}header nav button svg,header nav button b svg{width:24px!important;height:24px!important}header nav button{padding:6px 8px}
header nav button[aria-current="page"]{background:#fff;color:#1B1F24;box-shadow:0 1px 4px rgba(0,0,0,.14)}
header b:first-child{flex:none;font-size:17px}
header #hme{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
@media(max-width:430px){header #hme{display:none}header b:first-child{flex:1}}
@media(min-width:700px){header nav button{font-size:14px;line-height:1.2;font-weight:600;gap:6px;padding:7px 12px}}
header #hout{display:grid;place-items:center;width:36px;height:32px;padding:0;flex:none}@media(max-width:699px){
header{flex-wrap:wrap;row-gap:4px;padding-bottom:8px}
header b:first-child{flex:1}
header nav{order:3;flex:0 0 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:0}
header nav[hidden]{display:none}
header nav button{flex-direction:column;gap:2px;padding:6px 2px 5px;font-size:11.5px;line-height:1.15;font-weight:600;justify-content:center;white-space:nowrap}
header nav button b{font-size:inherit}
header nav button .sk{width:22px!important;height:22px!important}
}
.sticky{bottom:54px!important}.wrap{padding-bottom:130px!important}
header{padding-right:14px;gap:6px}
header b:first-child{order:1;flex:1!important}
header #hme{display:block!important;position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));height:32px;line-height:32px;max-width:36vw;text-align:center!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #sndBtn{position:static!important;order:2;flex:none;width:36px;height:32px}
header #hout{order:2}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px}.kv b{text-align:right}
@keyframes claimGlow{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.75);filter:brightness(1)}50%{box-shadow:0 0 0 9px rgba(249,115,22,0);filter:brightness(1.12)}}
[data-claim]{animation:claimGlow 1.3s ease-in-out infinite}
