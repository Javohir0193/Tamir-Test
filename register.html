<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://telegram.org https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://*.maps.yandex.net https://yandex.ru https://*.yandex.ru https://*.yandex.net https://yastatic.net; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com https://cdnjs.cloudflare.com https://*.yandex.ru https://*.yandex.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://suggest-maps.yandex.ru https://yandex.ru https://*.yandex.ru https://*.yandex.net; frame-src https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net; child-src https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ариза — Ta'mir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#F0F2F5;--card:#fff;--ink:#222;--muted:#7A808A;--line:#E3E6EB;--accent:#F97316;--ok:#1E9E5A;--err:#C0392B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
input,button,select{font:inherit;color:inherit}
input,select{font-size:16px!important}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px}
header h1{font-size:20px;margin:0;font-weight:700}
header small{display:block;color:var(--muted);font-size:13px}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-size:13px}
.lang button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-weight:500;margin:0 0 6px}
label small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
input[type=text],select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:0}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.phone{color:var(--muted);font-size:14px}
.groups{display:grid;gap:6px}
.grp{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;user-select:none}
.grp.on{border-color:var(--accent);background:#FFF5ED}
.grp input{width:18px;height:18px;accent-color:var(--accent)}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--bg)}
.photo .btn2{border:1px dashed var(--accent);color:var(--accent);background:#fff;border-radius:10px;padding:10px 14px;font-weight:500}
.err{color:var(--err);font-size:14px;margin:8px 2px 0;min-height:1em}
.submit{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.submit button{display:block;width:100%;max-width:536px;margin:0 auto;height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.submit button:disabled{opacity:.6}
.msg{background:var(--card);border-radius:14px;padding:22px 16px;text-align:center;margin-top:30px}
.msg b{display:block;font-size:18px;margin-bottom:6px}
h2.sec{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">…</div></div>
<script src="page-register.js"></script>
</body>
</html>
