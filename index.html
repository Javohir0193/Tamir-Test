<style>:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --ink:#333333; --muted:#6F6F78; --line:#E8E8EC;
  --accent:#F97316; --accent-dark:#E8620A; --accent-ink:#333333; --steel:#333333; --danger:#B3261E;
  box-sizing:border-box; color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3{font-family:Rubik,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding:14px 16px 12px;border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:6px;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
header h1{font-size:22px;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}

main{padding:22px 14px 110px;max-width:720px;margin:0 auto}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 4px;margin:8px -14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:84px;display:grid;place-items:center;font-size:40px;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:15px;font-weight:600;line-height:1.25;font-family:Rubik,system-ui,sans-serif}
.spec{margin:0;color:var(--muted);font-size:12.5px}
.price{font-family:Rubik,system-ui,sans-serif;font-weight:700;font-size:17px;margin-top:auto;padding-top:6px}
.price small{font-family:Rubik,system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:4px;padding:11px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step button{width:42px;height:40px;border:0;background:transparent;font-size:20px;font-weight:600}
.step span{font-weight:600;min-width:28px;text-align:center}
.step .qin{width:64px;border:0;background:transparent;text-align:center;font:inherit;font-size:16px;font-weight:700;color:inherit;padding:0;min-width:0}
button,.step,.qin{touch-action:manipulation}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.panel h2{font-size:18px;font-weight:700;margin-bottom:2px}
.panel .hint,.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.full{grid-column:1/-1}
.sub{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:600;margin:16px 0 0}
.sub small{font-weight:400;color:var(--muted);font-size:12.5px}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);margin:0;font-size:15px}
.krow input{width:20px;height:20px;margin:2px 0 0;padding:revert;border:revert;background:revert;border-radius:revert;accent-color:var(--steel)}
.krow .kn small{display:block;color:var(--muted);font-size:12.5px}
.krow .kq{text-align:right;font-weight:600;white-space:nowrap}
.krow .ks{grid-column:3;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 10px}

.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{font-weight:600}
.line .s{color:var(--muted);font-size:13px}
.line .step{grid-column:1;width:130px}
.line .sum{grid-column:2;align-self:center;font-weight:600}
.sumrow{display:flex;justify-content:space-between;padding:8px 0 0;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-family:Rubik,system-ui,sans-serif;font-weight:700;font-size:20px}
.modes{display:flex;gap:8px;margin:10px 0}
.modes label{flex:1;display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:var(--bg)}
.modes input{width:auto;margin:0;padding:revert;border:revert;background:revert}
.msg{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--danger)}
.actions{display:grid;gap:8px;margin-top:8px}

.order{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order h2{font-size:18px;font-weight:700}
.order .meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;white-space:nowrap}
.pill.done{background:var(--steel);color:var(--bg)}
.paybox{border:2px solid #E5E7EB;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.paybox.exp{border-color:#B3261E;background:#FDECEA}
.paylogo{height:46px;width:auto;display:block;margin:0 auto}.paylogo.sm{height:22px;margin:0}.btn.paybtn,.btn.lg.paybtn{background:#fff;border:2px solid #D1D5DB;padding:6px;min-height:68px;display:flex;align-items:center;justify-content:center}.btn.paybtn:active{background:#F3F4F6}
.rcp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}.rcpbox{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.rcpbox hr{border:0;border-top:1px dashed #D1D5DB;margin:8px 0}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tl{list-style:none;margin:8px 0 10px;padding:0}
.tl li{position:relative;padding:0 0 16px 32px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl li.done{color:var(--ink)}
.tl li.done i{background:var(--steel);border-color:var(--steel)}
.tl li.done::before{background:var(--steel)}
.tl li.now{color:var(--ink);font-weight:600}
.tl li.now i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.tl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.seller{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:13px}
.seller input{width:auto;margin:0;padding:revert;border:revert;background:revert}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{position:relative;border:0;background:transparent;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav button .ic{font-size:20px;line-height:1}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.nop{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.price.nopr{font-size:14px;color:var(--muted);font-weight:600}
.acc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px}
.acc.warn{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.lnk{background:none;border:0;color:var(--ink);text-decoration:underline;font-weight:600;padding:6px;min-height:36px;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:12px 12px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sbox h2{margin:0;font-size:20px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;padding:8px 0}
.agree input{display:inline-block;width:22px;height:22px;flex:none;margin:0;padding:0}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn.tg{background:#2AABEE;color:#fff}
.btn.off{opacity:.45}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.big{font-size:22px;font-weight:700;margin:4px 0 6px}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.task{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-align:left;min-height:130px}
.task .te{font-size:38px;line-height:1}
.task b{font-size:17px;font-family:Rubik,system-ui,sans-serif;font-weight:700}
.task small{color:var(--muted);font-size:13px}
.back{border:0;background:transparent;color:var(--steel);font-weight:600;padding:6px 0;margin-bottom:4px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.preset{padding:12px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:flex;flex-direction:column;gap:2px;align-items:center}
.preset small{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center}
.tiles small{display:block;color:var(--muted);font-size:12px}
.tiles b{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:700}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.stage.off{opacity:.65}
.sh{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:Rubik,system-ui,sans-serif}
.stt h3{font-size:17px;font-weight:700}
.stt p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0 2px;border-top:1px solid var(--line)}
.mn b{font-weight:600}
.mn small,.mq small{display:block;color:var(--muted);font-size:12.5px}
.mq{text-align:right;white-space:nowrap;font-weight:600}
.cov{margin:2px 0 4px;font-size:13px;color:var(--steel);font-weight:500}
.days{margin:8px 0 0;font-size:13px;color:var(--muted)}
.mnote{margin:8px 0 0;font-size:13px;padding:8px 10px;background:var(--bg);border-radius:4px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;padding:8px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px}
.seg button small{font-size:12px;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cta{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-top:8px;z-index:4}
.btn.lg{padding:15px 14px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sec{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:600;margin:20px 0 0;color:var(--muted)}
.tasks.small .task{min-height:96px}
.grp{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.job{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin:0 0 8px;color:var(--ink);font-size:16px}
.job input{width:22px;height:22px;margin:2px 0 0;padding:revert;border:revert;background:revert;border-radius:revert;accent-color:var(--steel)}
.job b{font-weight:600}
.job small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mn small.shop{color:var(--steel);font-weight:500}
.okb{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--steel);color:var(--bg);font-size:12.5px;font-weight:600}

body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;padding:0;border-bottom:0;box-shadow:0 4px 12px rgba(0,0,0,.05)}
header::after{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.h-top{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
.wm{display:inline-flex;align-items:baseline;white-space:nowrap}
.wm .hm{width:.84em;height:1em;margin:0 .02em 0 -.04em;flex:none;position:relative;top:.12em}
.wm .tp{width:.26em;height:.38em;margin:0 .04em 0 .03em;flex:none;position:relative;top:-.28em}
.logo .wm,.f-logo .wm{letter-spacing:.02em}
.logo .lg-i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:18px;letter-spacing:0;margin-right:9px;vertical-align:middle;position:relative;top:-2px}
.logo{font-weight:700;font-size:25px;letter-spacing:.14em;color:var(--ink);border:0;background:none;padding:0;white-space:nowrap}
.h-sp{flex:1}
.hsearch{flex:1 1 100%;order:5;display:flex;border:2px solid var(--accent);border-radius:4px;height:40px;overflow:hidden;background:#fff}
.hsearch input{flex:1;min-width:0;border:0;padding:0 12px;outline:none;background:transparent;font:inherit}
.hsearch button{width:46px;border:0;background:var(--accent);display:grid;place-items:center;color:var(--ink)}
.hsearch svg,.cartbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.langbtn{height:40px;padding:0 12px;border:0;border-radius:4px;background:var(--bg);font-weight:600}
.cartbtn{display:flex;height:40px;border-radius:4px;overflow:hidden;border:0;padding:0;background:var(--bg);font-weight:600}
.cartbtn .ci{display:grid;place-items:center;width:40px}
.cartbtn .cnt{background:var(--accent);min-width:40px;display:grid;place-items:center;font-size:14px}
main{padding:18px 14px 110px;max-width:720px;margin:0 auto}
main:has(.wide){max-width:1000px}
.badge{background:var(--accent);color:var(--ink)}
.btn{background:var(--accent);color:var(--ink);font-weight:600;min-height:44px}
.btn:hover{background:var(--accent-dark)}
.btn.alt{background:transparent;border:1px solid var(--line)}
.btn.alt:hover{background:var(--bg)}
.btn.dark{background:#333;color:#fff}
.btn.lg{box-shadow:none}
.btn.fit{width:auto;min-width:200px}
.chips{flex-wrap:wrap;overflow:visible;gap:6px 8px;padding:0;margin:8px 0 0}
.chip{border:0;border-radius:4px;background:transparent;color:var(--muted);padding:7px 10px;font-weight:500;font-size:13px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink);border:0}
.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.pic{height:120px;font-size:60px;background:var(--bg)}
.hero{border-radius:4px;overflow:hidden;background:var(--bg)}
.hero-img{height:200px;position:relative;background:linear-gradient(135deg,#A8D8F8 0%,#8CCBF5 100%);display:grid;place-items:center;overflow:hidden}
.hero-img .bigtxt{position:absolute;font-size:210px;font-weight:700;color:rgba(255,255,255,.4);line-height:1}
.hero-img .badge3{position:relative;width:92px;height:92px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:42px;box-shadow:6px 6px 0 #222}
.hero-text{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 18px;flex-wrap:wrap}
.hero-text h2{font-size:20px;font-weight:600;margin:0 0 6px}
.hero-text p{margin:0;color:var(--muted);font-size:14px;max-width:460px}
.sechead{font-size:20px;font-weight:600;margin:32px 0 12px}

/* ---- v90: Ta'mirExpress дизайни — тўқ фон, шиша карталар, тўқ сариқ градиент, Inter ---- */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --ink:#1F2430; --muted:rgba(31,36,48,.67); --line:rgba(31,36,48,.11);
  --accent:#F97316; --accent-dark:#EA580C; --accent-ink:#FFFFFF; --steel:#10B981; --danger:#FB7185;
  --glass:#FFFFFF; --glass-2:#FFFFFF; --glass-line:rgba(31,36,48,.10);
  --grad:linear-gradient(135deg,#F97316,#EA580C); --grad-text:linear-gradient(135deg,#F97316,#F59E0B);
  --green:#10B981; --gold:#D97706; --blue:#60A5FA;
  color-scheme:light;
}
body,h1,h2,h3,.card h3,.price,.price small,.total,.sub,.sec,.task b,.tiles b,.num{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg)!important;color:var(--ink)}
body::before,#sabar{background:var(--bg)!important}
h1,h2,h3{letter-spacing:-.02em}
.big{font-size:28px;font-weight:900;letter-spacing:-.03em}
.app h2.t,.sechead,.ghead h3{font-weight:800;letter-spacing:-.02em}
:focus-visible{outline-color:var(--gold)}
::placeholder{color:rgba(31,36,48,.47)}
option{background:var(--surface);color:var(--ink)}
input[type=radio],input[type=checkbox],.krow input,.job input{accent-color:var(--accent)!important}

/* юқори панел */
header{background:rgba(255,255,255,.86)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-line)}
.logo,.f-logo{color:var(--ink)}
.wm .hm{color:var(--accent)}
.wm .hm path[stroke]{stroke:var(--bg)}
.wm .tp path{fill:var(--gold)}
header .h-top nav button{color:rgba(31,36,48,.72)!important}
header .h-top nav button:hover{color:var(--ink)!important}
header .h-top nav button[aria-current="page"]{background:rgba(249,115,22,.1);color:var(--accent)!important;box-shadow:inset 0 0 0 1px rgba(249,115,22,.22)}
header .h-top nav button[aria-current="page"] .ni{stroke:var(--accent);fill:rgba(249,115,22,.18)}
header .h-top nav .badge{background:var(--grad)!important;color:#fff!important;box-shadow:0 0 0 2px var(--bg)}
.langbtn{background:var(--grad)!important;color:#fff!important;animation-name:lgp2!important}
@keyframes lgp2{0%,100%{box-shadow:0 8px 24px rgba(249,115,22,.35),0 0 0 2px var(--bg),0 0 0 2px rgba(249,115,22,.55)}50%{box-shadow:0 8px 24px rgba(249,115,22,.35),0 0 0 2px var(--bg),0 0 0 11px rgba(249,115,22,0)}}
.heroband{background:transparent}
.heroband .csearch{box-shadow:none}

/* қидирув ва майдонлар */
.csearch,.hsearch,.search{background:var(--glass-2);border:1px solid var(--line);border-radius:14px}
.csearch svg{stroke:rgba(31,36,48,.47)}
.csearch input,.hsearch input{color:var(--ink)}
.hsearch button{background:var(--grad);color:#fff}
.hsres{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.hsrow{border-bottom-color:var(--line)}
.hse{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-radius:12px}
.hsm small,.hsempty{color:var(--muted)}
label{color:var(--muted);font-weight:600}
label input,label select,label textarea,.acknote textarea{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:12px 16px}
label input:focus,label select:focus,label textarea:focus,.acknote textarea:focus{border-color:rgba(249,115,22,.5);outline:none}

/* кнопкалар */
.btn{background:var(--grad);color:#fff;font-weight:700;border-radius:14px;box-shadow:0 6px 20px rgba(249,115,22,.25)}
.btn:hover{background:var(--grad);filter:brightness(1.08)}
.btn.lg{min-height:56px;border-radius:16px;box-shadow:0 8px 32px rgba(249,115,22,.3)}

.btn.tg{background:#2AABEE;color:#1F2430;box-shadow:0 6px 20px rgba(42,171,238,.25)}
.btn.paybtn,.btn.lg.paybtn{background:#fff;border:0;border-radius:16px;box-shadow:none;color:var(--bg)}
.btn.paybtn:hover{filter:brightness(.95)}
.lnk,.th .lnk,.cheap-h button,.myr-h button{color:var(--accent);text-decoration:none;font-weight:700}
.back{color:var(--muted)}
.back:hover{color:var(--ink)}
.step{background:#FFFFFF;border:1px solid var(--line);border-radius:14px}
.step button{color:rgba(31,36,48,.62)}

.chip{background:#FFFFFF;border:1px solid var(--glass-line);border-radius:10px;color:var(--muted);font-weight:600}
.chip:hover{color:var(--ink)}

.seg button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}

.panel,.order,.stage,.myr,.cheapc,.sp-o,.task,.tiles div,.preset,.job,.gtile,.rq,.wideb,.mkt,.car,.zone,.carsel,.calc6 .ap,.mkcur,.st3,.dcard,.acc,.hero{background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.panel,.order,.stage,.myr,.cheapc,.hero{border-radius:24px}

.mkcur.none{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.2)}
.calchint{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--ink)}

.sp-row div{background:var(--glass-2)}
.sp-total{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* маҳсулот карточкаси */
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;transition:border-color .2s,transform .2s}

  .sh-act .ai{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--sc) 16%,transparent);margin-bottom:10px}

  .sh-sec{padding-top:64px}
  .sh-sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .sh-h{margin:0;font-size:28px;font-weight:900;letter-spacing:-.8px}
  .sh-sec>.sh-h{margin-bottom:24px}
  .shp .dk-cat{padding:24px 16px}

  .sh-how .n{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--grad);font-weight:800;font-size:17px}
  .sh-how b{display:block;font-size:16px;font-weight:700;margin-bottom:4px}
  .sh-how small{font-size:14px;color:rgba(31,36,48,.62);line-height:1.5}

  .fbox{padding:16px!important}
  .fbox .fl{padding:6px 14px 0}
  .fopt2{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;background:none;border:0;color:rgba(31,36,48,.85);font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;line-height:1.3}

  .chr{display:flex;gap:12px;align-items:center}
  .clrq{width:auto!important;min-height:42px!important;padding:0 16px;gap:8px;display:inline-flex;align-items:center;font-size:14px!important}
  .clrq .ic{width:16px;height:16px}
  .dkchips{margin:0 0 24px!important;gap:8px!important}

  .more{display:flex;justify-content:center;margin-top:32px}
  .more .btn{width:auto;padding:0 40px}

  .cfoot{flex-direction:column!important;align-items:stretch!important}
  .addb{width:100%!important;padding:0 16px!important}
  .addb .t{display:inline!important}
  .cfoot .step{width:100%!important}

  .ck-g{margin-top:8px}
  .ck-l .panel h2 .sn{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--grad);font-size:16px;font-weight:800}

  .sb-safe{justify-content:center}
