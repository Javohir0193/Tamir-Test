<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ta'mirExpress — стройматериалы с рынка</title>
<meta name="theme-color" content="#F6F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ta'mirExpress">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --ink:#333333; --muted:#6F6F78; --line:#E8E8EC;
  --accent:#F97316; --accent-dark:#E8620A; --accent-ink:#333333; --steel:#333333; --danger:#B3261E;
  box-sizing:border-box; color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3{font-family:Rubik,system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding:14px 16px 12px;border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:6px;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--ink) 10px 20px)}
header h1{font-size:22px;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}

main{padding:22px 14px 110px;max-width:720px;margin:0 auto}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 4px;margin:8px -14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:84px;display:grid;place-items:center;font-size:40px;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:15px;font-weight:600;line-height:1.25;font-family:Rubik,system-ui,sans-serif}
.spec{margin:0;color:var(--muted);font-size:12.5px}
.price{font-family:Rubik,system-ui,sans-serif;font-weight:700;font-size:17px;margin-top:auto;padding-top:6px}
.price small{font-family:Rubik,system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:4px;padding:11px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step button{width:42px;height:40px;border:0;background:transparent;font-size:20px;font-weight:600}
.step span{font-weight:600;min-width:28px;text-align:center}
.step .qin{width:64px;border:0;background:transparent;text-align:center;font:inherit;font-size:16px;font-weight:700;color:inherit;padding:0;min-width:0}
button,.step,.qin{touch-action:manipulation}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.panel h2{font-size:18px;font-weight:700;margin-bottom:2px}
.panel .hint,.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.full{grid-column:1/-1}
.sub{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:600;margin:16px 0 0}
.sub small{font-weight:400;color:var(--muted);font-size:12.5px}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);margin:0;font-size:15px}
.krow input{width:20px;height:20px;margin:2px 0 0;padding:revert;border:revert;background:revert;border-radius:revert;accent-color:var(--steel)}
.krow .kn small{display:block;color:var(--muted);font-size:12.5px}
.krow .kq{text-align:right;font-weight:600;white-space:nowrap}
.krow .ks{grid-column:3;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 10px}

.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{font-weight:600}
.line .s{color:var(--muted);font-size:13px}
.line .step{grid-column:1;width:130px}
.line .sum{grid-column:2;align-self:center;font-weight:600}
.sumrow{display:flex;justify-content:space-between;padding:8px 0 0;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;font-family:Rubik,system-ui,sans-serif;font-weight:700;font-size:20px}
.modes{display:flex;gap:8px;margin:10px 0}
.modes label{flex:1;display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:var(--bg)}
.modes input{width:auto;margin:0;padding:revert;border:revert;background:revert}
.msg{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--danger)}
.actions{display:grid;gap:8px;margin-top:8px}

.order{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.order .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order h2{font-size:18px;font-weight:700}
.order .meta{color:var(--muted);font-size:13px;margin:2px 0 10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;white-space:nowrap}
.pill.done{background:var(--steel);color:var(--bg)}
.paybox{border:2px solid #E5E7EB;border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}.paybox.exp{border-color:#B3261E;background:#FDECEA}
.paylogo{height:46px;width:auto;display:block;margin:0 auto}.paylogo.sm{height:22px;margin:0}.btn.paybtn,.btn.lg.paybtn{background:#fff;border:2px solid #D1D5DB;padding:6px;min-height:68px;display:flex;align-items:center;justify-content:center}.btn.paybtn:active{background:#F3F4F6}
.rcp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}.rcpbox{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.rcpbox hr{border:0;border-top:1px dashed #D1D5DB;margin:8px 0}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tl{list-style:none;margin:8px 0 10px;padding:0}
.tl li{position:relative;padding:0 0 16px 32px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl li.done{color:var(--ink)}
.tl li.done i{background:var(--steel);border-color:var(--steel)}
.tl li.done::before{background:var(--steel)}
.tl li.now{color:var(--ink);font-weight:600}
.tl li.now i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.tl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.seller{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:13px}
.seller input{width:auto;margin:0;padding:revert;border:revert;background:revert}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{position:relative;border:0;background:transparent;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav button .ic{font-size:20px;line-height:1}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:4px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.nop{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.price.nopr{font-size:14px;color:var(--muted);font-weight:600}
.acc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px}
.acc.warn{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.lnk{background:none;border:0;color:var(--ink);text-decoration:underline;font-weight:600;padding:6px;min-height:36px;white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--surface);color:var(--ink);width:100%;max-width:480px;border-radius:12px 12px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sbox h2{margin:0;font-size:20px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;padding:8px 0}
.agree input{display:inline-block;width:22px;height:22px;flex:none;margin:0;padding:0}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn.tg{background:#2AABEE;color:#fff}
.btn.off{opacity:.45}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.big{font-size:22px;font-weight:700;margin:4px 0 6px}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.task{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-align:left;min-height:130px}
.task .te{font-size:38px;line-height:1}
.task b{font-size:17px;font-family:Rubik,system-ui,sans-serif;font-weight:700}
.task small{color:var(--muted);font-size:13px}
.back{border:0;background:transparent;color:var(--steel);font-weight:600;padding:6px 0;margin-bottom:4px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.preset{padding:12px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:flex;flex-direction:column;gap:2px;align-items:center}
.preset small{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center}
.tiles small{display:block;color:var(--muted);font-size:12px}
.tiles b{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:700}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.stage.off{opacity:.65}
.sh{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:Rubik,system-ui,sans-serif}
.stt h3{font-size:17px;font-weight:700}
.stt p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0 2px;border-top:1px solid var(--line)}
.mn b{font-weight:600}
.mn small,.mq small{display:block;color:var(--muted);font-size:12.5px}
.mq{text-align:right;white-space:nowrap;font-weight:600}
.cov{margin:2px 0 4px;font-size:13px;color:var(--steel);font-weight:500}
.days{margin:8px 0 0;font-size:13px;color:var(--muted)}
.mnote{margin:8px 0 0;font-size:13px;padding:8px 10px;background:var(--bg);border-radius:4px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;padding:8px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px}
.seg button small{font-size:12px;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cta{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-top:8px;z-index:4}
.btn.lg{padding:15px 14px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sec{font-family:Rubik,system-ui,sans-serif;font-size:15px;font-weight:600;margin:20px 0 0;color:var(--muted)}
.tasks.small .task{min-height:96px}
.grp{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.job{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);margin:0 0 8px;color:var(--ink);font-size:16px}
.job input{width:22px;height:22px;margin:2px 0 0;padding:revert;border:revert;background:revert;border-radius:revert;accent-color:var(--steel)}
.job b{font-weight:600}
.job small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mn small.shop{color:var(--steel);font-weight:500}
.okb{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--steel);color:var(--bg);font-size:12.5px;font-weight:600}

body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;padding:0;border-bottom:0;box-shadow:0 4px 12px rgba(0,0,0,.05)}
header::after{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.h-top{display:flex;align-items:center;gap:10px;padding:12px 0 8px;flex-wrap:wrap}
.wm{display:inline-flex;align-items:baseline;white-space:nowrap}
.wm .hm{width:.84em;height:1em;margin:0 .02em 0 -.04em;flex:none;position:relative;top:.12em}
.wm .tp{width:.26em;height:.38em;margin:0 .04em 0 .03em;flex:none;position:relative;top:-.28em}
.logo .wm,.f-logo .wm{letter-spacing:.02em}
.logo .lg-i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:18px;letter-spacing:0;margin-right:9px;vertical-align:middle;position:relative;top:-2px}
.logo{font-weight:700;font-size:25px;letter-spacing:.14em;color:var(--ink);border:0;background:none;padding:0;white-space:nowrap}
.h-sp{flex:1}
.hsearch{flex:1 1 100%;order:5;display:flex;border:2px solid var(--accent);border-radius:4px;height:40px;overflow:hidden;background:#fff}
.hsearch input{flex:1;min-width:0;border:0;padding:0 12px;outline:none;background:transparent;font:inherit}
.hsearch button{width:46px;border:0;background:var(--accent);display:grid;place-items:center;color:var(--ink)}
.hsearch svg,.cartbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.langbtn{height:40px;padding:0 12px;border:0;border-radius:4px;background:var(--bg);font-weight:600}
.cartbtn{display:flex;height:40px;border-radius:4px;overflow:hidden;border:0;padding:0;background:var(--bg);font-weight:600}
.cartbtn .ci{display:grid;place-items:center;width:40px}
.cartbtn .cnt{background:var(--accent);min-width:40px;display:grid;place-items:center;font-size:14px}
main{padding:18px 14px 110px;max-width:720px;margin:0 auto}
main:has(.wide){max-width:1000px}
.badge{background:var(--accent);color:var(--ink)}
.btn{background:var(--accent);color:var(--ink);font-weight:600;min-height:44px}
.btn:hover{background:var(--accent-dark)}
.btn.alt{background:transparent;border:1px solid var(--line)}
.btn.alt:hover{background:var(--bg)}
.btn.dark{background:#333;color:#fff}
.btn.lg{box-shadow:none}
.btn.fit{width:auto;min-width:200px}
.chips{flex-wrap:wrap;overflow:visible;gap:6px 8px;padding:0;margin:8px 0 0}
.chip{border:0;border-radius:4px;background:transparent;color:var(--muted);padding:7px 10px;font-weight:500;font-size:13px}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink);border:0}
.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{transition:box-shadow .2s}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.pic{height:120px;font-size:60px;background:var(--bg)}
.hero{border-radius:4px;overflow:hidden;background:var(--bg)}
.hero-img{height:200px;position:relative;background:linear-gradient(135deg,#A8D8F8 0%,#8CCBF5 100%);display:grid;place-items:center;overflow:hidden}
.hero-img .bigtxt{position:absolute;font-size:210px;font-weight:700;color:rgba(255,255,255,.4);line-height:1}
.hero-img .badge3{position:relative;width:92px;height:92px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:42px;box-shadow:6px 6px 0 #222}
.hero-text{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 18px;flex-wrap:wrap}
.hero-text h2{font-size:20px;font-weight:600;margin:0 0 6px}
.hero-text p{margin:0;color:var(--muted);font-size:14px;max-width:460px}
.sechead{font-size:20px;font-weight:600;margin:32px 0 12px}
.promo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:700px){.promo{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;min-height:116px;border:0;border-radius:4px;padding:12px;text-align:left;font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;gap:3px;transition:transform .2s;color:var(--ink)}
.tile:hover{transform:translateY(-2px)}
.tile small{font-weight:400;font-size:12.5px;color:#444;max-width:68%}
.tile .emo{position:absolute;right:10px;bottom:6px;font-size:44px;line-height:1}
.steps3{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.steps3{grid-template-columns:repeat(3,1fr)}}
.st3{background:var(--bg);border-radius:4px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.st3 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700}
.st3 b{font-weight:600}
footer{background:#333;color:#fff;margin-top:40px;padding:28px 0 110px}
footer .f-logo{font-size:24px;font-weight:700;letter-spacing:.14em}
footer p{margin:10px 0 0;color:#bbb;font-size:13px}

/* ---- v90: Ta'mirExpress дизайни — тўқ фон, шиша карталар, тўқ сариқ градиент, Inter ---- */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --ink:#1F2430; --muted:rgba(31,36,48,.67); --line:rgba(31,36,48,.11);
  --accent:#F97316; --accent-dark:#EA580C; --accent-ink:#FFFFFF; --steel:#10B981; --danger:#FB7185;
  --glass:#FFFFFF; --glass-2:#FFFFFF; --glass-line:rgba(31,36,48,.10);
  --grad:linear-gradient(135deg,#F97316,#EA580C); --grad-text:linear-gradient(135deg,#F97316,#F59E0B);
  --green:#10B981; --gold:#D97706; --blue:#60A5FA;
  color-scheme:light;
}
body,h1,h2,h3,.card h3,.price,.price small,.total,.sub,.sec,.task b,.tiles b,.num{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg)!important;color:var(--ink)}
body::before,#sabar{background:var(--bg)!important}
h1,h2,h3{letter-spacing:-.02em}
.big{font-size:28px;font-weight:900;letter-spacing:-.03em}
.app h2.t,.sechead,.ghead h3{font-weight:800;letter-spacing:-.02em}
:focus-visible{outline-color:var(--gold)}
::placeholder{color:rgba(31,36,48,.47)}
option{background:var(--surface);color:var(--ink)}
input[type=radio],input[type=checkbox],.krow input,.job input{accent-color:var(--accent)!important}

/* юқори панел */
header{background:rgba(255,255,255,.86)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-line)}
.logo,.f-logo{color:var(--ink)}
.wm .hm{color:var(--accent)}
.wm .hm path[stroke]{stroke:var(--bg)}
.wm .tp path{fill:var(--gold)}
header .h-top nav button{color:rgba(31,36,48,.72)!important}
header .h-top nav button:hover{color:var(--ink)!important}
header .h-top nav button[aria-current="page"]{background:rgba(249,115,22,.1);color:var(--accent)!important;box-shadow:inset 0 0 0 1px rgba(249,115,22,.22)}
header .h-top nav button[aria-current="page"] .ni{stroke:var(--accent);fill:rgba(249,115,22,.18)}
header .h-top nav .badge{background:var(--grad)!important;color:#fff!important;box-shadow:0 0 0 2px var(--bg)}
.langbtn{background:var(--grad)!important;color:#fff!important;animation-name:lgp2!important}
@keyframes lgp2{0%,100%{box-shadow:0 8px 24px rgba(249,115,22,.35),0 0 0 2px var(--bg),0 0 0 2px rgba(249,115,22,.55)}50%{box-shadow:0 8px 24px rgba(249,115,22,.35),0 0 0 2px var(--bg),0 0 0 11px rgba(249,115,22,0)}}
.heroband{background:transparent}
.heroband .csearch{box-shadow:none}

/* қидирув ва майдонлар */
.csearch,.hsearch,.search{background:var(--glass-2);border:1px solid var(--line);border-radius:14px}
.csearch svg{stroke:rgba(31,36,48,.47)}
.csearch input,.hsearch input{color:var(--ink)}
.hsearch button{background:var(--grad);color:#fff}
.hsres{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.hsrow{border-bottom-color:var(--line)}
.hse{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-radius:12px}
.hsm small,.hsempty{color:var(--muted)}
label{color:var(--muted);font-weight:600}
label input,label select,label textarea,.acknote textarea{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:12px 16px}
label input:focus,label select:focus,label textarea:focus,.acknote textarea:focus{border-color:rgba(249,115,22,.5);outline:none}

/* кнопкалар */
.btn{background:var(--grad);color:#fff;font-weight:700;border-radius:14px;box-shadow:0 6px 20px rgba(249,115,22,.25)}
.btn:hover{background:var(--grad);filter:brightness(1.08)}
.btn.lg{min-height:56px;border-radius:16px;box-shadow:0 8px 32px rgba(249,115,22,.3)}
.btn.alt{background:var(--glass);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.alt:hover{background:var(--glass-2);filter:none}
.btn.dark{background:var(--glass-2);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.tg{background:#2AABEE;color:#1F2430;box-shadow:0 6px 20px rgba(42,171,238,.25)}
.btn.paybtn,.btn.lg.paybtn{background:#fff;border:0;border-radius:16px;box-shadow:none;color:var(--bg)}
.btn.paybtn:hover{filter:brightness(.95)}
.lnk,.th .lnk,.cheap-h button,.myr-h button{color:var(--accent);text-decoration:none;font-weight:700}
.back{color:var(--muted)}
.back:hover{color:var(--ink)}
.step{background:#FFFFFF;border:1px solid var(--line);border-radius:14px}
.step button{color:rgba(31,36,48,.62)}
.step button[data-inc]{color:var(--accent)}
.step .qin{font-weight:800}
.chip{background:#FFFFFF;border:1px solid var(--glass-line);border-radius:10px;color:var(--muted);font-weight:600}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.25);color:var(--accent)}
.seg button{background:var(--glass);border:1px solid var(--line);border-radius:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}

/* шиша карталар */
.panel,.order,.stage,.myr,.cheapc,.sp-o,.task,.tiles div,.preset,.job,.gtile,.rq,.wideb,.mkt,.car,.zone,.carsel,.calc6 .ap,.mkcur,.st3,.dcard,.acc,.hero{background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.panel,.order,.stage,.myr,.cheapc,.hero{border-radius:24px}
.panel,.order{padding:20px}
.panel h2,.order h2{font-weight:800}
.mkt,.car,.zone,.carsel,.rq,.wideb,.gtile,.task,.sp-o,.dcard{border-radius:18px}
.mkt,.car,.zone,.carsel{border-width:2px}
.mkt.on,.car.on,.zone.on,.carsel.on,.modes label:has(input:checked){border-color:var(--accent);background:rgba(249,115,22,.06)}
.gtile:hover,.mkt:hover,.car:hover,.rq:hover,.task:hover{border-color:rgba(249,115,22,.3)}
.modes label{background:var(--glass);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.ap .e,.rq .e{background:var(--glass-2);border-radius:18px}
.ap{color:var(--ink)}
.myr-g button{background:var(--glass-2);color:var(--ink)}
.mnote{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px}
.tile{background:var(--glass)!important;border:1px solid var(--glass-line);border-radius:20px;color:var(--ink)}
.tile small,.myr-g small,.zone small,.carsel small,.car small,.mkt small,.cheap-n,.mkcur .tx small,.sp-o summary small,.sp-i small,.drv small,.eta small,.pinrow small,.pick-bot small{color:var(--muted)}
.cheap-n b{color:var(--ink)}
.st3 .n,.num{background:var(--grad);color:#fff}
.hero-img{background:radial-gradient(circle at 85% 0%,rgba(249,115,22,.22),transparent 70%),var(--glass)}
.hero-img .bigtxt{color:rgba(31,36,48,.08)}
.hero-img .badge3{background:var(--grad);box-shadow:0 0 0 8px rgba(249,115,22,.15),0 0 0 20px rgba(249,115,22,.05)}
.banner,.sp-top{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(249,115,22,.04));border:1px solid rgba(249,115,22,.2);border-radius:24px}
.banner p,.sp-top small{color:var(--muted)}
.banner .go,.mkcur.none button,.wideb .cnt{background:var(--grad);color:#fff}
.mkcur button{background:var(--glass-2);color:var(--ink)}
.mkcur.none{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.2)}
.calchint{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--ink)}
.calchint small,.calchint .ar{color:var(--muted)}
.sp-row div{background:var(--glass-2)}
.sp-total{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sp-o[open] summary{border-bottom-color:var(--line)}
.sp-i{border-bottom-color:var(--line)}

/* маҳсулот карточкаси */
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;transition:border-color .2s,transform .2s}
.card:hover{box-shadow:none;border-color:rgba(249,115,22,.3);transform:translateY(-2px)}
.pic{height:140px;background:linear-gradient(135deg,#FFFFFF,#FFFFFF)}
.card .body{padding:16px 16px 18px;gap:6px}
.card h3{font-weight:700}
.price{font-weight:900;font-size:20px;letter-spacing:-.02em}
.price small{color:var(--muted);font-weight:500}
.grid{gap:16px}

/* нарх даражаси */
.pbar3{background:linear-gradient(90deg,#10B981 0%,#FBBF24 50%,#F43F5E 100%)}
.pbar3 i{border-color:var(--bg)}
.mkt small.cheap,.cheap-n small.cheap,.cheap-ok,.pinrow .pinok{color:#34D399}
.mkt small.mid,.cheap-n small.mid{color:var(--gold)}
.mkt small.dear,.cheap-n small.dear{color:var(--danger)}
.car .cp{color:var(--accent);background:rgba(249,115,22,.12)}
.mn small.shop,.cov{color:var(--blue)}

/* сават ва жами */
.line .sum{font-weight:800}
.total{font-weight:900}
.total>span:last-child{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.myr-ord .bar,.pbar{background:var(--line)}
.myr-ord .bar i{background:var(--grad)}
.pbar i{background:var(--green)}

/* буюртмалар ва ҳолат */
.pill{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.22);border-radius:8px;color:var(--accent);font-size:12px;font-weight:700;padding:4px 12px}
.pill.done,.okb{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);color:var(--green)}
.sp-i small.okb{color:var(--green)}
.tl li i{width:20px;height:20px;border:2px solid rgba(31,36,48,.26);background:var(--bg)}
.tl li.done{color:var(--green);font-weight:600}
.tl li.done i{background:var(--green);border-color:var(--green)}
.tl li.done::before{background:var(--green)}
.tl li.now{color:var(--accent);font-weight:700}
.tl li.now i{background:var(--grad);border-color:var(--accent);box-shadow:0 0 0 6px rgba(249,115,22,.15)}
.paybox{background:var(--glass);border:1px solid var(--line);border-radius:18px}
.paybox.exp{background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.35)}
.plate{background:#fff;color:var(--bg);border-color:var(--bg)}
.eta{font-weight:900;letter-spacing:-.02em}

/* карта */
.mapbox{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px}
.mapbox .leaflet-tile-pane,.pick-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-container{background:var(--bg)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface)!important;color:var(--ink)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--ink)!important}
.pick{background:var(--bg)}
.pick-top .x{background:var(--glass-2);color:var(--ink)}

/* ойналар, хабарлар, пастки қисм */
.sheet,.rcp{background:rgba(5,7,12,.7)}
.sbox,.rcpbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0}
.rcpbox hr{border-top-color:var(--line)}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
footer{background:var(--bg);border-top:1px solid var(--glass-line)}
footer p,footer .f-bottom{color:var(--muted)}
footer .f-bottom{border-top-color:var(--line)}

/* ---- v95: макетга 100% мослаш (Ta'mirExpress Design Canvas) ---- */
body{background:
  radial-gradient(900px 520px at 85% -10%,rgba(249,115,22,.10),transparent 60%),
  radial-gradient(800px 500px at -10% 30%,rgba(59,130,246,.07),transparent 60%),
  var(--bg) fixed!important;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;-webkit-font-smoothing:antialiased}
*,h1,h2,h3,.card h3,.price,.price small,.total,.sub,.task b,.tiles b,.num,.st3 .n{font-family:inherit}
input,select,textarea,button{font-family:inherit}

/* логотип: градиент квадрат + Ta'mir + Express */
.qx{display:inline-flex!important;align-items:center;gap:10px;letter-spacing:-.5px!important;font-size:20px!important;font-weight:800!important;color:#1F2430!important;line-height:1}
.qx-i{flex:none;width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.qx-i svg{width:20px;height:20px}
.qx-t em{font-style:normal;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(min-width:700px){.qx{font-size:22px!important}.qx-i{width:40px;height:40px;border-radius:12px}.qx-i svg{width:22px;height:22px}}
@media(max-width:380px){.qx{font-size:17px!important;gap:8px}.qx-i{width:32px;height:32px;border-radius:10px}}
/* v98: сарлавҳадаги янги логотип — гирих юлдузи + болға-Т */
.qx-i.qx-star{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 4px 12px rgba(249,115,22,.35))}
.qx-i.qx-star svg{width:100%!important;height:100%!important}
@media(max-width:699px){.qx-i.qx-star{width:calc((100vw - 36px)/5)!important;height:36px!important;display:flex;justify-content:center;align-items:center;margin-right:calc(14px - (100vw - 36px)/10)}.qx-i.qx-star svg{width:36px!important;height:36px!important}}
@media(max-width:380px){.qx-i.qx-star{height:32px!important;margin-right:calc(14px - (100vw - 36px)/10)}.qx-i.qx-star svg{width:32px!important;height:32px!important}}
.qx-w{display:inline-flex;align-items:baseline;font-weight:900;letter-spacing:-.02em}
.qx-w .qx-ht{height:.88em;width:auto;margin-right:-.07em;position:relative;top:.05em;flex:none}
.qx-w .qx-ap{width:.24em;height:.24em;align-self:flex-start;margin:.1em -.03em 0 -.01em;flex:none}
footer .f-logo.qx{margin-bottom:4px}

/* юқори панел — макетдаги шиша навигация */
header{background:rgba(255,255,255,.85)!important;border-bottom:1px solid rgba(31,36,48,.09)!important;box-shadow:none!important}
header .h-top{padding-top:14px;padding-bottom:12px}
header .h-top nav button{border-radius:12px!important;font-weight:600}
header .h-top nav button[aria-current="page"]{background:rgba(249,115,22,.12)!important;box-shadow:inset 0 0 0 1px rgba(249,115,22,.25)!important}

/* бош саҳифа: hero ва статистика */
.qx-hero{position:relative;padding:22px 2px 6px;display:flex;flex-direction:column;gap:12px}
.qx-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.22);color:var(--accent);font-size:13px;font-weight:600}
.qx-tag i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(249,115,22,.18)}
.qx-hero h1{margin:0;font-size:32px;line-height:1.08;font-weight:900;letter-spacing:-1.2px}
.qx-hero .gt{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.qx-stats div{background:var(--glass);border:1px solid rgba(31,36,48,.09);border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.qx-stats b{font-size:22px;font-weight:900;letter-spacing:-.8px;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.qx-stats b.o{background-image:linear-gradient(135deg,#F97316,#FBBF24)}
.qx-stats b.b{background-image:linear-gradient(135deg,#60A5FA,#3B82F6)}
.qx-stats b.g{background-image:linear-gradient(135deg,#34D399,#10B981)}
.qx-stats b.p{background-image:linear-gradient(135deg,#C084FC,#8B5CF6)}
.qx-stats small{font-size:12px;color:rgba(31,36,48,.52);font-weight:500}
@media(min-width:700px){.qx-hero{padding:40px 2px 12px;gap:16px}.qx-hero h1{font-size:52px;letter-spacing:-2px}.qx-hero p{font-size:17px}.qx-stats{gap:14px}.qx-stats div{padding:20px 12px;border-radius:24px}.qx-stats b{font-size:32px}.qx-stats small{font-size:13px}}
@media(max-height:600px){.qx-hero h1{font-size:26px}.qx-hero p{display:none}}
.heroband{margin:0 0 4px!important;padding:0!important;background:transparent!important}
.csearch{height:52px!important;border-radius:16px!important;background:#FFFFFF!important;border:1px solid rgba(31,36,48,.11)!important;padding:0 16px!important}
.csearch:focus-within{border-color:rgba(249,115,22,.5)!important;box-shadow:0 0 0 4px rgba(249,115,22,.1)}

/* сарлавҳалар */
.big{font-size:30px!important;font-weight:900!important;letter-spacing:-1px!important;margin:6px 0 14px}
.app h2.t{font-size:20px!important;font-weight:800!important;letter-spacing:-.5px;margin:14px 2px 2px!important}
.hint,.note{color:rgba(31,36,48,.57)}
.th .lnk{color:var(--accent)!important}
@media(min-width:700px){.big{font-size:36px!important}.app h2.t{font-size:24px!important}}

/* шиша карталар — макет: 0.03 фон, 0.06 чегара */
.panel,.order,.stage,.myr,.cheapc,.sp-o,.task,.tiles div,.preset,.job,.gtile,.rq,.wideb,.mkt,.car,.zone,.carsel,.mkcur,.st3,.dcard,.acc,.card,.tile,.paybox,.mapbox{border-color:rgba(31,36,48,.09)!important}

.myr-g button{border-radius:18px!important;background:#FFFFFF!important;border:1px solid rgba(31,36,48,.09)!important}
.myr-sum span{font-size:22px;font-weight:900;letter-spacing:-.5px}

/* ҳисоблаш тайллари ва каталог бўлимлари — рангли иконка фонлари */
.calc6 .ap,.gtile{border-radius:22px!important;transition:border-color .2s,transform .2s,background .2s}
.calc6 .ap:hover,.gtile:hover{background:#FFFFFF!important;transform:translateY(-2px)}
.calc6 .ap .e,.gtile .ge{display:grid;place-items:center;border-radius:16px;background:rgba(249,115,22,.12)!important}
.calc6 .ap:nth-child(6n+2) .e,.gtiles .gtile:nth-child(6n+2) .ge{background:rgba(59,130,246,.14)!important}
.calc6 .ap:nth-child(6n+3) .e,.gtiles .gtile:nth-child(6n+3) .ge{background:rgba(16,185,129,.14)!important}
.calc6 .ap:nth-child(6n+4) .e,.gtiles .gtile:nth-child(6n+4) .ge{background:rgba(139,92,246,.16)!important}
.calc6 .ap:nth-child(6n+5) .e,.gtiles .gtile:nth-child(6n+5) .ge{background:rgba(244,63,94,.14)!important}
.calc6 .ap:nth-child(6n+6) .e,.gtiles .gtile:nth-child(6n+6) .ge{background:rgba(251,191,36,.14)!important}

if (TC.cats.length){

{ const g = byIdRaw(13); if (g) g.cat = "mix"; }   // грунтовка нужна для черновых работ — переносим в «Смеси»

  return { pos, lvl, txt };

function slotOk(day, i){ if (day > 0) return true; const n = new Date(); return SLOTS[i][1] >= n.getHours() + n.getMinutes() / 60 + LEAD_HOURS; }
function fixSlot(){
  const f = S.form; if (slotOk(f.day, f.slot)) return;
  for (let d = f.day; d < 3; d++) for (let i = 0; i < SLOTS.length; i++) if (slotOk(d, i)){ f.day = d; f.slot = i; return; }
}

function renderSpend(){
  const v = document.getElementById("view"), os = S.orders || [];
  if (!os.length){
    v.innerHTML = `<h2 class="big">Расходы на ремонт</h2><div class="empty"><p>Здесь будет вся история покупок: сколько вы потратили на ремонт и что купили в каждом заказе.</p><button class="btn" data-tab="calc" style="max-width:280px">Посчитать ремонт</button></div>`;
    return;
  }
  const sumIt = (o, w) => (o.items || []).filter(i => !!i.w === w).reduce((a, i) => a + i.price * i.q, 0);
  let tot = 0, mat = 0, work = 0;
  os.forEach(o => { tot += o.total; mat += sumIt(o, false) + sumIt(o, true); });
  const fee = Math.max(0, tot - mat - work);
  const dkey = ts => { const d = new Date(ts), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
    const same = (a, b) => a.toDateString() === b.toDateString();
    return same(d, t) ? "Сегодня" : same(d, y) ? "Вчера" : d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit", year:"numeric" }); };
  const groups = [];
  os.slice().sort((a, b) => b.ts - a.ts).forEach(o => { const k = dkey(o.ts); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, sum:0, list:[] }); g.sum += o.total; g.list.push(o); });
  const hm = ts => new Date(ts).toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" });
  const orderHTML = o => {
    const st = stagesFor(o), last = o.stage >= st.length - 1;
    const its = o.items || [], f = Math.max(0, o.total - its.reduce((a, i) => a + i.price * i.q, 0));
    return `<details class="sp-o"><summary><div><b>Заказ №${o.no}</b><small>${hm(o.ts)} · ${its.length} поз. · <span class="pill ${last ? "done" : ""}">${st[o.stage][0]}</span></small></div><span class="sp-sum">${fmt(o.total)} <small>${CURRENCY}</small></span></summary>
      <div class="sp-items">${its.map(i => `<div class="sp-i"><div>${esc(i.n)}<small>${fmt(i.q)} ${esc(i.u || "")} × ${fmt(i.price)} ${CURRENCY}</small></div><b>${fmt(i.price * i.q)}</b></div>`).join("")}
      ${f ? `<div class="sp-i"><div>Доставка</div><b>${fmt(f)}</b></div>` : ""}
      <div class="sp-i tot"><div>Итого</div><b>${fmt(o.total)} ${CURRENCY}</b></div></div></details>`;
  };
  v.innerHTML = `<h2 class="big">Расходы на ремонт</h2>
    ${S.seller ? `<p class="hint">Режим продавца: здесь все заказы всех клиентов.</p>` : ""}
    <section class="sp-top"><small>Всего потрачено</small><div class="sp-total">${fmt(tot)} <span>${CURRENCY}</span></div>
      <div class="sp-row"><div><small>Материалы</small><b>${fmt(mat)}</b></div><div><small>Доставка</small><b>${fmt(fee)}</b></div></div>
      <small>Заказов: ${os.length}</small></section>
    <p class="hint">Нажмите на заказ, чтобы увидеть, что купили и по какой цене.</p>
    ${groups.map(g => `<h3 class="sp-day"><span>${g.k}</span><span>${fmt(g.sum)} ${CURRENCY}</span></h3>${g.list.map(orderHTML).join("")}`).join("")}`;
}

async function loadOrders(quiet){
  if (!dbReady) return;
  try {
    const q = await sb.from("orders").select("*").order("no", { ascending:false });
    if (q.error) throw q.error;
    const prev = JSON.stringify((S.orders || []).map(o => [o.no, o.status, o.payStatus, o.payDue]));
    S.orders = q.data.map(fromRow);
    let tkSig = "";
    if (S.profile && !S.seller) { try { const tq = await sb.rpc("my_tickets"); if (!tq.error && Array.isArray(tq.data)) S.tickets = tq.data; } catch(e){} }
    if (!S.seller) { S.payOpts = S.payOpts || {}; for (const o of S.orders) if (o.payStatus === "unpaid") { try { const pq = await sb.rpc("pay_options", { p_no:o.no }); if (!pq.error && Array.isArray(pq.data) && pq.data.length) S.payOpts[o.no] = pq.data; } catch(e){} } }
    tkSig = JSON.stringify((S.tickets || []).map(t => [t.id, t.status, t.msgs.length]));
    const same = prev === JSON.stringify(S.orders.map(o => [o.no, o.status, o.payStatus, o.payDue])) && tkSig === S.tkSig && payOptSig() === S.poSig; S.poSig = payOptSig(); S.tkSig = tkSig;
    if (quiet && same) return;
    const ae = document.activeElement; if (ae && /^(helpt|ackt)/.test(ae.id || "")) return;
    if (S.tab === "orders") { const y = window.scrollY; renderOrders(); window.scrollTo(0, y); }
    else if (S.tab === "home" && S.view === "home") renderHome();
  } catch(e){ console.error("loadOrders", e); }
}

async function loadCatalog(){
  try {
    const r = await sb.from("catalog_public").select("id, cat, name, spec, unit, emoji, base_price, best_price, best_shop, offers");
    // новые товары, которые йиғувчи добавили и админ одобрил — добавляем в каталог приложения
    if (!r.error && r.data) r.data.forEach(x => { if (!byId(x.id) && CATS.some(c => c.id === x.cat))
      P.push({ id:x.id, cat:x.cat, e:x.emoji || "📦", n:x.name, s:x.spec || "", p:0, nop:true, u:x.unit, base:Number(x.base_price) || 0, shop:"" }); });
    try { const cq = await sb.rpc("catalog_categories");   // ўзбекча категория номлари базадан (i18n лексикасига қўшилади)
      if (!cq.error && Array.isArray(cq.data) && window.addUz) window.addUz(Object.fromEntries(cq.data.filter(c => c.name_ru && c.name_uz).map(c => [c.name_ru, c.name_uz]))); } catch(e){}
    let rows = r.data || [];
    if (S.mk){
      const q = await sb.from("catalog_market").select("id, best_price, best_shop, offers").eq("market_id", S.mk);
      if (!q.error) rows = q.data || []; else console.warn("catalog_market", q.error);
    }
    const mkAtLoad = S.mk;
    if (r.error) return;
    if (mkAtLoad !== S.mk) return;
    const m = new Map(rows.map(x => [x.id, x]));
    P.forEach(p => {                                       // только настоящие цены; нет цены — «цена уточняется»
      if (p.cat === "work") return;
      const x = m.get(p.id);
      if (x && x.best_price){ p.p = Number(x.best_price); p.shop = x.best_shop || ""; p.avg = p.p; p.live = true; p.nop = false; }
      else { p.p = 0; p.shop = ""; p.avg = 0; p.live = false; p.nop = true; }
    });
    S.liveCatalog = true;
    rerender();
  } catch(e){ console.error("loadCatalog", e); }
}

function loadCompare(){

  if (!items.length) { box.innerHTML = ""; return; }

    const seq = ++cmpSeq;
    try {
      const r = await sb.rpc("cart_compare", { p:{ market_id:S.mk, items } });
      const b = document.getElementById("cmpBox"); if (seq !== cmpSeq || !b) return;
      if (r.error || !r.data) { b.innerHTML = ""; return; }

function applyQuote(){

async function mountMaps(keep){
  const boxes = [...document.querySelectorAll(".mapbox[data-map]")];
  if (!boxes.length) return;
  try { await loadLeaflet(); } catch(e){ boxes.forEach(b => b.textContent = "Карта не загрузилась. Проверьте интернет."); return; }
  for (const box of boxes){
    const no = +box.dataset.map, o = S.orders.find(x => x.no === no); if (!o || !o.dlat) continue;
    let m = MAPS.get(no);
    const old = keep && keep.get(String(no));
    if (m && old){ box.replaceWith(old); m.el = old; }
    else {
      const map = L.map(box, { zoomControl:false, attributionControl:true }); tiles(map);
      const home = o.lat ? L.marker([o.lat, o.lng], { icon:icon(IC.marker("B"), "home") }).addTo(map) : null;
      const car = L.marker([o.dlat, o.dlng], { icon:icon(IC.marker("truck"), "car") }).addTo(map);
      if (o.pickLat) L.marker([o.pickLat, o.pickLng], { icon:icon(IC.marker("A"), "home") }).addTo(map);
      m = { el:box, map, car, home }; MAPS.set(no, m);
    }
    m.car.setLatLng([o.dlat, o.dlng]);
    const pts = [[o.dlat, o.dlng]].concat(o.lat ? [[o.lat, o.lng]] : []).concat(o.pickLat ? [[o.pickLat, o.pickLng]] : []);
    if (pts.length > 1) m.map.fitBounds(pts, { padding:[40, 40], maxZoom:16 }); else m.map.setView(pts[0], 15);
    setTimeout(() => m.map.invalidateSize(), 50);
  }
}

const sNorm = s => String(s || "").toLowerCase().replace(/ё/g, "е").replace(/[ʼ'`ʻ’]/g, "");
function sHit(p, q){
  const w = sNorm(q).split(/\s+/).filter(Boolean); if (!w.length) return true;
  let h = p.n + " " + p.s; if (window.tUz) { try { h += " " + window.tUz(p.n) + " " + window.tUz(p.s); } catch(e){} }
  h = sNorm(h); if (w.every(x => h.includes(x))) return true;
  return !!(S.fz && S.fz.q === q.trim() && S.fz.ids.has(p.id));   // база топган (хато ёзилган / лотинча) сўзлар
}
// Қидирув базада (search_products): кирилл/лотин ва хато ёзилган сўзни ҳам топади. Тармоқ бўлмаса — оддий қидирув ишлайверади.
function fzSearch(){
  clearTimeout(S.fzT);
  const q = (S.q || "").trim();
  if (q.length < 2 || !sb || !dbReady || (S.fz && S.fz.q === q)) return;
  S.fzT = setTimeout(async () => {
    try {
      const r = await sb.rpc("search_products", { p_q:q, p_limit:60 });
      if (r.error || !Array.isArray(r.data) || (S.q || "").trim() !== q) return;
      S.fz = { q, ids:new Set(r.data.map(x => x.id)) };
      if (S.tab === "catalog" && !S.pid){ if (DK()) renderCatalog(); else { const b = document.getElementById("catbody"); if (b) b.innerHTML = catBody(); } }
      else homeRes();
    } catch(e){}
  }, 350);
}
function homeFind(q){ return q.trim() ? P.filter(p => p.cat !== "work" && sHit(p, q)) : []; }
function homeResHTML(){
  const el = document.getElementById("homeq"); const q = el ? el.value.trim() : "";
  if (!q) return "";
  const items = homeFind(q);
  if (!items.length) return `<div class="hsempty">Ничего не найдено. Попробуйте другое слово.</div>`;
  return items.slice(0, 8).map(p => `<div class="hsrow">
    <span class="hse" style="--c:${catColor(p.cat)}">${p.e}</span>
    <div class="hsm"><b>${p.n}</b><small>${p.s}${p.nop ? "" : " · " + fmt(p.p) + " " + CURRENCY + " / " + p.u}</small></div>
    ${qty(p.id) ? stepper(p.id) : `<button class="btn hsadd" data-add="${p.id}">+ В корзину</button>`}
  </div>`).join("") + (items.length > 8 ? `<button class="lnk hsall" data-hsall>Все результаты (${items.length}) ›</button>` : "");
}
function homeRes(){
  const box = document.getElementById("hsres"); if (!box) return;
  const h = homeResHTML(); box.innerHTML = h; box.hidden = !h;
}
// Каталогда фақат ўзгарган карточканинг тугмасини янгилаймиз (бутун рўйхатни қайта чизмаймиз).
function patchCard(id){
  const arts = document.querySelectorAll(`[data-pid="${id}"]`); let ok = false;
  arts.forEach(art => {
    const step = art.querySelector(".step"), n = qty(id);
    if (n && step){ const inp = step.querySelector("input"); if (inp && document.activeElement !== inp) inp.value = n; ok = true; return; }
    const old = step || art.querySelector("[data-add]"); if (!old) return;
    const tmp = document.createElement("div"); tmp.innerHTML = n ? stepper(id) : addBtn(id);
    old.replaceWith(tmp.firstElementChild); ok = true;
  });
  return ok;
}
function refresh(id){
  updateBadge();
  if (S.tab === "home") { homeRes(); if (id != null) patchCard(id); }
  if (S.tab === "catalog"){ if (S.pid) { renderProduct(); return; } if (id != null && patchCard(id)) return; const l = document.getElementById("list"); if (l) l.innerHTML = listHTML(); }
  else if (S.tab === "cart") renderCart();
}
function show(tab){
  if (S.tab !== tab) logEvent("tab", { t:tab });
  S.tab = tab;
  document.querySelectorAll("nav button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const focus = tab === "search"; if (focus) tab = S.tab = "catalog";
  document.querySelectorAll("nav button").forEach(b => { if (b.dataset.tab === (focus ? "search" : tab)) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  document.querySelectorAll(".hd-cart,.hd-prof").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  ({home:renderHome, calc:renderHomeTab, catalog:renderCatalog, cart:renderCart, orders:renderOrders, spend:renderSpend})[tab]();
  document.getElementById("view").classList.toggle("home", tab === "home" || (tab === "calc" && !S.task));
  window.scrollTo(0, 0); updateBadge();
  if (focus) { const q = document.getElementById("hq"); if (q) q.focus(); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-login")) { openLogin(); return; }
  if (t.hasAttribute("data-closelogin")) { closeLogin(); return; }
  if (t.hasAttribute("data-logout")) { doLogout(); return; }
  if (t.hasAttribute("data-soon")) { toast("Скоро будет доступно"); return; }
  { const sb2 = t.closest && t.closest("[data-shop]"); if (sb2) { S.shopSel = +sb2.dataset.shop || 0; S.shopTouched = true; const b = document.getElementById("cmpBox"); if (b && S.cmpData) b.innerHTML = cmpHTML(S.cmpData); refreshQuote(true); return; } }
  if (t.dataset.gocat) { S.cat = t.dataset.gocat; S.grp = grpOf(S.cat); S.q = ""; S.pid = null; S.page = 1; const h = document.getElementById("hdq"); if (h) h.value = ""; show("catalog"); return; }
  if (t.dataset.open) { openProduct(+t.dataset.open); return; }
  if (t.dataset.page) { S.page = +t.dataset.page; const y = window.scrollY; renderCatalog(); window.scrollTo(0, y); return; }
  if (t.hasAttribute("data-clrall") || t.hasAttribute("data-clrq")) { S.q = ""; if (t.hasAttribute("data-clrall")) { S.cat = "all"; S.grp = "all"; } S.page = 1; const h = document.getElementById("hdq"); if (h) h.value = ""; renderCatalog(); return; }
  if (t.hasAttribute("data-tgl")) { t.classList.toggle("on"); t.setAttribute("aria-pressed", t.classList.contains("on")); return; }
  if (t.dataset.pq) { S.pq = Math.max(1, (S.pq || 1) + +t.dataset.pq); updPq(); return; }
  if (t.hasAttribute("data-padd")) { const id = S.pid; setQty(id, qty(id) + (S.pq || 1)); toast("✓ Добавлено в корзину"); return; }
  if (t.dataset.paysel) { S.form.pay = t.dataset.paysel; document.querySelectorAll("[data-paysel]").forEach(b => b.classList.toggle("on", b === t)); return; }
  if (t.dataset.otab) { S.otab = t.dataset.otab; renderOrders(); return; }
  if (t.dataset.oopen != null) { S.oOpen = +t.dataset.oopen; renderOrders(); return; }
  if (DK() && S.tab === "catalog" && !S.pid && (t.dataset.grp || t.dataset.cat)) { if (t.dataset.grp) { S.grp = t.dataset.grp; S.cat = "all"; S.q = ""; const h = document.getElementById("hdq"); if (h) h.value = ""; } else S.cat = t.dataset.cat; S.page = 1; renderCatalog(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { if (t.dataset.tab === "catalog") S.pid = null; if (t.dataset.tab === "calc" && S.tab === "calc") { S.task = null; S.view = "home"; } if (t.dataset.tab === "home") { S.mkOpen = S.mkOpen && S.tab === "home"; S.view = "home"; } return show(t.dataset.tab); }
  if (t.dataset.scroll) { const el = document.getElementById(t.dataset.scroll); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  if (t.hasAttribute("data-hsall")) { S.q = document.getElementById("homeq").value.trim(); S.cat = "all"; S.grp = "all"; show("catalog"); logSearch(); return; }
  if (t.dataset.add) { setQty(+t.dataset.add, 1); return; }
  if (t.dataset.inc) { setQty(+t.dataset.inc, qty(+t.dataset.inc) + 1); return; }
  if (t.dataset.dec) { setQty(+t.dataset.dec, qty(+t.dataset.dec) - 1); return; }
  if (t.dataset.del) { setQty(+t.dataset.del, 0); return; }
  if (t.dataset.grp) { S.grp = t.dataset.grp; S.cat = "all"; const b = document.getElementById("catbody"); if (b) b.innerHTML = catBody(); window.scrollTo(0, 0); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === S.cat)); document.getElementById("list").innerHTML = listHTML(); return; }
  if (t.dataset.task) { if (S.tab !== "calc") show("calc"); document.getElementById("view").classList.remove("home"); S.task = t.dataset.task; S.size = {}; renderSize(); window.scrollTo(0, 0); return; }
  if (t.dataset.back) { const b = t.dataset.back; if (b === "home") { S.task = null; renderCalc(); document.getElementById("view").classList.add("home"); } else if (b === "size") renderSize(); else if (b === "result") renderResult(); else renderJobs(); window.scrollTo(0, 0); return; }
  if (t.dataset.preset) { S.size = Object.assign({}, curTask().presets[+t.dataset.preset][1]); nextAfterSize(); return; }
  if (t.hasAttribute("data-calc")) {
    const tk = curTask();
    if (!tk.fields.every(f => num(S.size[f[0]]) > 0)) { document.getElementById("szmsg").textContent = "Введите размеры цифрами, например 3 или 3,5."; return; }
    nextAfterSize(); return;
  }
  if (t.hasAttribute("data-full")) { const tk = curTask(); S.jobs[tk.id] = {}; tk.rec.forEach(j => S.jobs[tk.id][j] = true); renderResult(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute("data-plan")) { renderResult(); window.scrollTo(0, 0); return; }
  if (t.dataset.sm) { const [i, m] = t.dataset.sm.split(":"); const { t: tk, stages } = getResult(); setMode(tk, stages[+i], +m); const y = window.scrollY; renderResult(); window.scrollTo(0, y); return; }
  if (t.hasAttribute("data-addall")) {
    const { t: tk, stages } = getResult();
    stages.forEach(st => { const m = modeOf(tk, st); if (m === 2) return;
      st.items.forEach(it => { S.cart[it.id] = (S.cart[it.id] || 0) + it.q; });
      if (m === 1) st.work.forEach(([id, q]) => { S.cart[id] = (S.cart[id] || 0) + q; }); });
    saveCart(); toast("Всё добавлено в корзину"); show("cart"); return;
  }
  if (t.hasAttribute("data-tolist")) { renderChecklist(); window.scrollTo(0, 0); return; }
  if (t.dataset.stage) { const { t: tk, stages } = getResult(); addStage(tk, stages[+t.dataset.stage]); saveCart(); toast("Этап добавлен в корзину"); show("cart"); return; }
  if (t.hasAttribute("data-stageall")) {
    const { t: tk, stages } = getResult();
    stages.forEach(st => { const k = skey(tk, st); if (modeOf(tk, st) !== 2 && !S.plan[k] && !S.pending[k]) addStage(tk, st); });
    saveCart(); toast("Добавлено в корзину"); show("cart"); return;
  }
  if (t.hasAttribute("data-resetplan")) {
    const { t: tk, stages } = getResult();
    stages.forEach(st => { const k = skey(tk, st); delete S.plan[k]; delete S.pending[k]; });
    Object.keys(S.chk).forEach(k => { if (k.startsWith(tk.id + "|")) delete S.chk[k]; });
    saveJSON("plan", S.plan); renderChecklist(); return;
  }
  if (t.dataset.advance) {
    const o = S.orders.find(x => x.no === +t.dataset.advance);
    if (o && o.stage < stagesFor(o).length - 1) {
      if (!dbReady) { o.stage++; o.times[o.stage] = Date.now(); saveOrders(); renderOrders(); }
    }
    return;
  }
  if (t.id === "copyOrder") {
    logEvent("checkout", { n:Object.keys(S.cart).length });
    if (needLogin()) { openLogin(); return; }
    if (!validate()) return;
    t.disabled = true;
    createOrder().then(({ no, err }) => {
      const m = document.getElementById("msg");
      if (!no){ t.disabled = false; m.textContent = err; return; }
      afterOrder(no); const o0 = S.orders.find(x => x.no === no); toast(o0 && o0.payStatus === "unpaid" ? "Заказ №" + no + " создан. Оплатите его" : "Заказ №" + no + " оформлен"); show("orders");
    });
    return;
  }
});
document.addEventListener("click", e => {
  if (e.target.closest("button,input,a,select,label,textarea")) return;
  const c = e.target.closest(".card[data-pid]"); if (c) openProduct(+c.dataset.pid);
});
document.addEventListener("submit", e => { if (e.target.id === "hdsearch" || e.target.id === "bigsearch") { e.preventDefault(); const h = document.getElementById(e.target.id === "bigsearch" ? "bigq" : "hdq"); S.q = h.value.trim(); const hq = document.getElementById("hdq"); if (hq) hq.value = S.q; S.cat = "all"; S.grp = "all"; S.pid = null; S.page = 1; show("catalog"); logSearch(); } });
document.addEventListener("submit", e => { if (e.target.id === "homesearch") { e.preventDefault(); S.q = document.getElementById("homeq").value.trim(); S.cat = "all"; S.grp = "all"; show("catalog"); logSearch(); const q = document.getElementById("hq"); if (q) q.value = S.q; return; } });
document.addEventListener("submit", e => { if (e.target.id === "hsearch") { e.preventDefault(); S.q = document.getElementById("hq").value; S.cat = "all"; document.getElementById("hq").blur(); logSearch(); const b = document.getElementById("catbody"); if (b) b.innerHTML = catBody(); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "homeq") { S.q = t.value; homeRes(); fzSearch(); return; }
  if (t.id === "hdq") { S.q = t.value; S.page = 1; if (S.tab === "catalog") { S.pid = null; S.cat = "all"; S.grp = "all"; renderCatalog(); } clearTimeout(S.sT); S.sT = setTimeout(logSearch, 1500); fzSearch(); return; }
  if (t.hasAttribute("data-pqin")) { S.pq = Math.max(1, Math.min(99999, parseInt(String(t.value).replace(/\D/g, "")) || 1)); updPq(false); return; }
  if (t.id === "hq") { clearTimeout(S.sT); S.sT = setTimeout(logSearch, 1500); S.q = t.value; fzSearch(); const b = document.getElementById("catbody"); if (S.tab === "catalog" && b) b.innerHTML = catBody(); return; }
  if (t.dataset.sz) { S.size[t.dataset.sz] = t.value; return; }
  if (t.dataset.form) S.form[t.dataset.form] = (t.dataset.form === "day" || t.dataset.form === "slot") ? +t.value : t.value;
  if (t.hasAttribute("data-carfrom")) S.carFrom = t.value;
});
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.qin) setTimeout(() => e.target.select(), 0); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.qin) e.target.blur(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "sellerMode") { S.seller = t.checked; renderOrders(); return; }
  if (t.hasAttribute("data-sort")) { S.sort = t.value; S.page = 1; renderCatalog(); return; }
  if (t.hasAttribute("data-pqin")) { updPq(); return; }
  if (t.dataset.ck) { S.chk[t.dataset.ck] = t.checked; const y = window.scrollY; renderChecklist(); window.scrollTo(0, y); return; }
  if (t.dataset.job) { const m = S.jobs[S.task] = S.jobs[S.task] || {}; m[t.dataset.job] = t.checked; if (t.checked && ALT[t.dataset.job]) m[ALT[t.dataset.job]] = false; const y = window.scrollY; renderJobs(); window.scrollTo(0, y); return; }
  if (t.dataset.qin){ const id = +t.dataset.qin, n = Math.floor(Number(String(t.value).replace(/\D/g, ""))); if (n > 0) setQty(id, Math.min(n, 99999)); else t.value = qty(id); return; }
  if (t.name === "mode") { S.form.mode = t.value; renderCart(); return; }
  if (t.dataset.form === "day" || t.dataset.form === "slot") { S.form[t.dataset.form] = +t.value; if (t.dataset.form === "day") S.form.slot = 0; if (S.view === "car") renderCar(); else renderCart(); }
  if (t.name === "carwhen") { S.form.carNow = t.value === "now"; renderCar(); return; }
  if (t.hasAttribute("data-carmk")) { S.carMk = +t.value; return; }
});

show("home");
initDB();
if (/[?&]pay=\d+/.test(location.search)) { try { history.replaceState(null, "", location.pathname); } catch(e){} setTimeout(() => { show("orders"); toast("Проверяем оплату…"); }, 400); }
if (SHOP_TG) { const f = document.getElementById("footTg"); if (f) f.innerHTML = `Telegram: <a href="https://t.me/${SHOP_TG}">@${SHOP_TG}</a>`; }
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
