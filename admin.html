<title>Ta'mir · Админ</title>
<style>
:root{--bg:#F3F4F6;--c:#fff;--ink:#1B1F24;--mu:#6B7280;--ln:#E5E7EB;--ac:#F97316;--g:#1F9D55;--gb:#E6F6ED;--r:#D93025;--rb:#FDECEA;--y:#B7791F;--yb:#FFF6DB;--bl:#2563EB}
@media(prefers-color-scheme:dark){:root{--bg:#121417;--c:#1C2024;--ink:#ECEFF2;--mu:#9AA3AD;--ln:#2E343A;--g:#3DCB7C;--gb:#173326;--r:#FF6B5E;--rb:#3A1D1A;--y:#F2C14E;--yb:#3A311A;--bl:#7AA7FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
html{touch-action:manipulation}button,a,input,select,label,tr,[data-open],[data-tkdet],[data-cdet],[data-pdet]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{background:var(--c);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0;font-size:16px}
button{cursor:pointer}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;background:var(--ac);color:#1B1F24}
.btn.alt{background:transparent;border:1px solid var(--ln);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.red{background:var(--r);color:#fff}
.btn:disabled{opacity:.5}
header{padding-top:env(safe-area-inset-top,0);position:sticky;top:0;z-index:5;background:var(--ac);border-bottom:0;color:#1B1F24;border-radius:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
header .mu{color:rgba(27,31,36,.78)}header .btn.alt{background:rgba(255,255,255,.92);color:#1B1F24;border:0}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.hd h1{font-size:18px;margin:0;flex:1}
nav{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto}
nav button{background:transparent;border:0;border-radius:10px;padding:8px 12px;white-space:nowrap;color:rgba(27,31,36,.75);font-weight:600;display:inline-flex;align-items:center;gap:6px}nav button svg{flex:none}
nav button.on{background:#fff;color:#1B1F24;box-shadow:0 1px 4px rgba(0,0,0,.12)}
nav .badge{background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--c);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--c);border-radius:14px;padding:12px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px;display:block;margin-top:2px}
.kpi.g b{color:var(--g)}.kpi.r b{color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--gb);color:var(--g)}.pill.r{background:var(--rb);color:var(--r)}.pill.y{background:var(--yb);color:var(--y)}.pill.m{background:var(--ln);color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.row>input[type=search]{flex:1;min-width:160px}
.al{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:10px;margin:6px 0;cursor:pointer}
.al.red{background:var(--rb)}.al.yellow{background:var(--yb)}
.al.ok{background:var(--gb);cursor:default}
.fn{margin:8px 0}.fn .t{display:flex;justify-content:space-between;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--ln);margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);border-radius:5px}
.mu{color:var(--mu)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--bg);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
@media(min-width:800px){.sheet{align-items:center}.sbox{border-radius:16px}}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}.kv span:nth-child(even){text-align:right;font-weight:600}
.login{max-width:420px;margin:12vh auto;padding:0 16px}.login.card{width:calc(100% - 32px);padding:16px}
.msg{margin:10px 0;color:var(--mu)}
.err{color:var(--r);font-weight:600}
.set{display:flex;gap:8px;align-items:center;margin:6px 0}.set label{flex:1;font-size:14px}.set small{display:block;color:var(--mu)}.set input{width:130px;text-align:right}
.kb{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));align-items:start}.kc{background:var(--c);border-radius:14px;padding:10px}.kc h3{font-size:14px;margin:0 0 8px}.kcard{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;font-size:14px}.kcard.yellow{background:var(--yb)}.kcard.red{background:var(--rb)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(249,115,22,.22)}
.btn{transition:transform .08s,filter .15s}.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(.96)}
.btn.alt:hover{border-color:var(--ac);filter:none}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 10px rgba(0,0,0,.03)}
.card h2{display:flex;align-items:center;gap:8px}.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--ac);flex:none}
.kpi{border-left:4px solid var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.04)}.kpi.g{border-left-color:var(--g)}.kpi.r{border-left-color:var(--r)}
.kpi b{font-variant-numeric:tabular-nums}
.bar i{background:var(--ac)}
th{position:sticky;top:0;background:var(--c);text-transform:none;letter-spacing:.02em}
tbody tr:hover td{background:rgba(249,115,22,.06)}
tr[data-open],tr[data-cdet],tr[data-tkdet],tr[data-pdet]{cursor:pointer}
.pill.y{background:rgba(249,115,22,.15);color:#C2410C}
.kc{border-top:3px solid var(--ac)}.kcard{border:1px solid var(--ln);transition:border-color .15s,transform .08s}.kcard:hover{border-color:var(--ac)}.kcard:active{transform:scale(.99)}
.al{border-left:4px solid transparent}.al.red{border-left-color:var(--r)}.al.yellow{border-left-color:var(--ac)}.al.ok{border-left-color:var(--g)}
.sheet{backdrop-filter:blur(2px)}.sbox{box-shadow:0 -6px 30px rgba(0,0,0,.25)}
main{min-height:60vh}
.skel{display:grid;gap:12px}.skel i{display:block;height:84px;border-radius:14px;background:linear-gradient(90deg,var(--c) 25%,var(--ln) 50%,var(--c) 75%);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
@media(max-width:520px){main{padding:10px}.card{padding:12px}.hd h1{font-size:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#1B1F24;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="xtheme.css">
<style>
/* Админ: мижоз, ҳайдовчи ва йиғувчи иловалари билан бир хил тўқ мавзу */
:root{--bg:#F6F3EE;--yb:rgba(251,191,36,.12);--rb:rgba(251,113,133,.12);--bl:#60A5FA;--ac:#F97316}
header .mu{color:rgba(31,36,48,.72)!important}
header nav button{color:rgba(31,36,48,.72)!important}
header nav button.on{background:rgba(249,115,22,.14)!important;color:#1F2430!important;box-shadow:inset 0 0 0 1px rgba(249,115,22,.3)!important}
.btn.red{background:linear-gradient(135deg,#F43F5E,#E11D48)!important;box-shadow:0 6px 20px rgba(244,63,94,.22)}
.card{border-radius:18px}
input,select,textarea{background:#FFFFFF;border-color:rgba(31,36,48,.14);color:#1F2430}
input:focus,select:focus,textarea:focus{border-color:#F97316;outline:none}
th{color:rgba(31,36,48,.67)}
.hd h1.qx{white-space:nowrap;flex:1 1 auto;min-width:0}.hd h1.qx .qx-t{white-space:nowrap}
@media(max-width:520px){.hd>.mu{display:none}}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

</body>
